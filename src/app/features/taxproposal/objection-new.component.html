<form [formGroup]="form" (ngSubmit)="submit()" class="objection-page">

  <h2>নতুন আপত্তি</h2>

  <!-- ১. কিসের বিরুদ্ধে আপত্তি -->
  <div class="card">
    <h3>১. কিসের বিরুদ্ধে আপত্তি</h3>

    <label>বিষয়ের ধরন *</label>
    <input formControlName="subjectType" readonly style="background: #f3f4f6;" />

    <label>বিষয়ের ID (যেমন কর প্রস্তাবের ID) *</label>
    <input formControlName="subjectId" readonly style="background: #f3f4f6;" />

    <label>হোল্ডিং ID *</label>
    <input formControlName="holdingId" readonly placeholder="অটো আসছে..." style="background: #f3f4f6;" />
    <small *ngIf="!form.get('holdingId')?.value">হোল্ডিং অটো লোড হচ্ছে, একটু অপেক্ষা করুন...</small>
  </div>

  <!-- ২. অভিযোগকারীর তথ্য -->
  <div class="card">
    <h3>২. অভিযোগকারীর তথ্য</h3>

    <label>অভিযোগকারীর নাম *</label>
    <input formControlName="complainantName" placeholder="আপনার নাম" />

    <label>ফোন নম্বর *</label>
    <input formControlName="complainantPhone" placeholder="01XXXXXXXXX" />

    <label>ইমেইল (ঐচ্ছিক)</label>
    <input formControlName="complainantEmail" placeholder="আপনার ইমেইল" />
  </div>

  <!-- ৩. অভিযোগের বিবরণ -->
  <div class="card">
    <h3>৩. অভিযোগের বিবরণ</h3>

    <label>বিষয় *</label>
    <input formControlName="subject" placeholder="অভিযোগের বিষয়" />

    <label>শ্রেণী</label>
    <select formControlName="category">
      <option value="COMPLAINT">অভিযোগ</option>
      <option value="SUGGESTION">পরামর্শ</option>
      <option value="OBJECTION">আপত্তি</option>
    </select>

    <label>অগ্রাধিকার</label>
    <select formControlName="priority">
      <option value="NORMAL">সাধারণ</option>
      <option value="URGENT">জরুরি</option>
    </select>

    <label>বিবরণ *</label>
    <textarea formControlName="description" rows="4" placeholder="কেন আপত্তি করছেন, সংক্ষেপে লিখুন"></textarea>

    <label>মন্তব্য (ঐচ্ছিক)</label>
    <textarea formControlName="remarks" rows="2" placeholder="অতিরিক্ত মন্তব্য"></textarea>

    <label>প্রমাণ থাকলে ছবি / PDF (ঐচ্ছিক)</label>
    <input type="file" (change)="onFile($event)" accept=".pdf,.jpg,.jpeg,.png" />
  </div>

  <button class="btn-primary" type="submit" [disabled]="submitting">
    {{ submitting ? 'পাঠানো হচ্ছে...' : 'আপত্তি জমা দিন' }}
  </button>

</form>
